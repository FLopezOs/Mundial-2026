name: Actualizar resultados Mundial 2026

on:
  schedule:
    # Corre cada 30 minutos entre 12:00 y 02:00 UTC (horario de partidos)
    - cron: '*/30 12-23 * * *'
    - cron: '*/30 0-2 * * *'
  workflow_dispatch:          # También se puede disparar manualmente desde GitHub

permissions:
  contents: write             # Necesario para hacer git push

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests --quiet

      - name: Actualizar resultados desde ESPN
        run: python scripts/update_data.py

      - name: Commit y push si hay cambios
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions Bot"
          git diff --quiet public/data.json || (
            git add public/data.json &&
            git commit -m "Auto: resultados $(date -u '+%Y-%m-%d %H:%M UTC')" &&
            git push
          )
          echo "✓ Listo."
