name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ── Pipeline de datos (solo en schedule / workflow_dispatch) ──

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        if: github.event_name != 'push'
        run: pip install openpyxl pandas numpy requests scipy

      - name: Actualizar datos del torneo
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python -X utf8 modelo/actualizar.py
          python -X utf8 modelo/exportar_json.py
          python -X utf8 modelo/stats_espn.py

      - name: Commitear datos actualizados
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data.json || true
          git add webapp/public/estadisticas.json || true
          git add Data/odds.json || true
          git add output/Mundial2026_Tracker.xlsx || true
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, nada que commitear."
          else
            git commit -m "chore: actualizar datos del torneo [skip ci]"
            git push || echo "Push falló (posible conflicto); se reintentará en la próxima corrida."
          fi

      # ── Build y deploy de Pages (siempre, con los datos ya actualizados) ──

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Build
        working-directory: webapp
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
