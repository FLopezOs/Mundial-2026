name: Actualizar datos cada 30 minutos

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python
        run: pip install openpyxl pandas numpy requests scipy --quiet

      - name: Actualizar resultados desde ESPN
        continue-on-error: true
        run: |
          python -X utf8 modelo/actualizar.py
          python -X utf8 modelo/exportar_json.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data.json Data/odds.json output/Mundial2026_Tracker.xlsx || true
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: actualizar datos del torneo"
            git push
          fi
